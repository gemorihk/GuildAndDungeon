<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公會與地下城 - Guild And Dungeon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <div>
            <span id="guild-name" style="font-weight:bold; color:var(--accent);">公會與地下城</span>
            <span style="font-size: 12px; color: #aaa;">(Lv.<span id="guild-lv">1</span>)</span>
        </div>
        <div class="res-container">
            <span class="res-item">🪙 金幣: <span id="res-gold">0</span></span>
            <span class="res-item">💎 魔晶石: <span id="res-gems">0</span></span>
            <button class="btn btn-primary" style="padding: 2px 8px; font-size: 12px;" onclick="manualSaveGame()">💾 存檔</button>
            <button class="btn btn-danger" style="padding: 2px 8px; font-size: 12px;" onclick="resetSaveData()">🔄 重置</button>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn active" onclick="switchTab('battle', this)">⚔️ 討伐戰鬥</button>
        <button class="nav-btn" onclick="switchTab('heroes', this)">👥 冒險者陣型</button>
        <button class="nav-btn" onclick="switchTab('inventory', this)">🎒 背包倉庫</button>
        <button class="nav-btn" onclick="switchTab('shop', this)">🏪 道具商店</button>
        <button class="nav-btn" onclick="switchTab('forge', this)">🔨 鐵匠鋪</button>
        <button class="nav-btn" onclick="switchTab('quests', this)">📜 任務告示</button>
        <button class="nav-btn" onclick="switchTab('bestiary', this)">📖 怪物圖鑑</button>
    </div>

    <div class="main-content">
        <!-- 1. 戰鬥頁籤 -->
        <div id="tab-battle" class="tab-content active">
            <div class="battle-header">
                <div>
                    <label for="dungeon-select">選擇地下城：</label>
                    <select id="dungeon-select" onchange="changeDungeon(this.value)"></select>
                </div>
                <div class="battle-controls">
                    <button class="btn btn-success" id="explore-btn" onclick="toggleExplore()">🚀 開始探索</button>
                    <button class="btn btn-warning" id="pause-btn" onclick="togglePause()" style="display:none;">⏸️ 暫停</button>
                    <button class="btn btn-danger" onclick="retreatAndSettle()">🏠 結算回城</button>
                </div>
            </div>

            <div class="auto-potion-panel">
                <span>🧪 自動喝藥：當隊員 HP 低於 </span>
                <input type="number" id="auto-potion-threshold" value="40" min="10" max="90" style="width: 50px; text-align: center;"> % 時，使用
                <select id="auto-potion-type">
                    <option value="pot_small">初級回復藥水 (80HP)</option>
                    <option value="pot_medium">中級回復藥水 (250HP)</option>
                    <option value="pot_large">高級急救藥水 (700HP)</option>
                </select>
            </div>

            <div class="battle-view">
                <div class="battle-column">
                    <h4 style="margin:0 0 10px 0; color:var(--accent);">🛡️ 我方陣型 (ATB行動計量)</h4>
                    <div style="font-size:11px; color:#aaa; margin-bottom:5px;">【前衛】</div>
                    <div id="party-front-list"></div>
                    <div style="font-size:11px; color:#aaa; margin:10px 0 5px 0;">【後衛】</div>
                    <div id="party-back-list"></div>
                </div>
                <div class="battle-column">
                    <h4 style="margin:0 0 10px 0; color:#ff6b6b;">⚔️ 敵人 <span id="wave-counter" style="font-size:12px; color:#aaa;">(未出發)</span></h4>
                    <div style="font-size:11px; color:#aaa; margin-bottom:5px;">【敵方前排】</div>
                    <div id="enemy-front-list"></div>
                    <div style="font-size:11px; color:#aaa; margin:10px 0 5px 0;">【敵方后排】</div>
                    <div id="enemy-back-list"></div>
                    <button id="boss-btn" class="boss-trigger-btn" onclick="triggerBossFight()">🔥 挑戰本層 Boss！ 🔥</button>
                </div>
            </div>

            <div class="battle-log" id="battle-log">
                <div>[系統] 整備完成，請點擊「🚀 開始探索」！</div>
            </div>
            <div class="loot-bar">
                <strong>📦 暫存收穫：</strong> 
                🪙 金幣: <span id="temp-gold" style="color:var(--accent);">0</span> | 
                🎁 戰利品: <span id="temp-loot-items">無</span>
            </div>
        </div>

        <!-- 2. 冒險者頁籤 -->
        <div id="tab-heroes" class="tab-content">
            <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <h3 style="margin:0;">公會冒險者列表</h3>
                <button class="btn btn-success" onclick="recruitHero()">🍺 招募冒險者 (120金幣)</button>
            </div>
            <div class="hero-grid" id="hero-list"></div>
        </div>

        <!-- 3. 背包倉庫 -->
        <div id="tab-inventory" class="tab-content">
            <h3>🎒 道具與裝備倉庫</h3>
            <div class="sub-nav">
                <button class="sub-btn active" onclick="filterInv('all', this)">全部</button>
                <button class="sub-btn" onclick="filterInv('equipment', this)">裝備</button>
                <button class="sub-btn" onclick="filterInv('potion', this)">消耗品</button>
                <button class="sub-btn" onclick="filterInv('material', this)">素材</button>
            </div>
            <div class="shop-list-container" id="inventory-grid"></div>
        </div>

        <!-- 4. 道具商店 -->
        <div id="tab-shop" class="tab-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="margin:0;">🏪 道具商店 <span id="shop-tier-badge" style="font-size:12px; color:var(--accent);">(商店等級 1)</span></h3>
            </div>
            <div class="sub-nav">
                <button class="sub-btn active" onclick="filterShop('all', this)">全部道具</button>
                <button class="sub-btn" onclick="filterShop('potion', this)">藥水/消耗品</button>
                <button class="sub-btn" onclick="filterShop('equipment', this)">裝備</button>
            </div>
            <div class="shop-list-container" id="shop-items-list"></div>
        </div>

        <!-- 5. 鐵匠鋪 -->
        <div id="tab-forge" class="tab-content">
            <h3>🔨 鐵匠鋪</h3>
            <p style="color:#aaa;">敬請期待！</p>
        </div>

        <!-- 6. 任務告示板 -->
        <div id="tab-quests" class="tab-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="margin:0;">📜 公會討伐任務告示板</h3>
                <span style="font-size:12px; color:var(--accent);">已接取任務：<span id="active-quest-count">0</span> / <span id="max-quest-limit">2</span></span>
            </div>
            <div id="quest-list"></div>
        </div>

        <!-- 7. 怪物圖鑑 -->
        <div id="tab-bestiary" class="tab-content">
            <h3>📖 討伐怪物圖鑑</h3>
            <div id="bestiary-list" class="hero-grid"></div>
        </div>
    </div>

    <!-- 角色詳情 Modal 彈窗 -->
    <div id="hero-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeHeroModal()">&times;</span>
            <div class="modal-tab-header">
                <button class="modal-tab-btn active" onclick="switchModalTab('stats', this)">📊 屬性與資質</button>
                <button class="modal-tab-btn" onclick="switchModalTab('skills', this)">⚔️ 技能與熟練度</button>
            </div>
            <div id="modal-hero-body" style="margin-top: 15px;"></div>
        </div>
    </div>

    <!-- 雙欄職業選擇彈窗 (含頂部當前能力顯示與未滿足條件提示) -->
    <div id="job-modal" class="modal">
        <div class="modal-content" style="max-width: 750px;">
            <span class="close-modal" onclick="closeJobModal()">&times;</span>
            <h3 style="margin-top:0;">轉職與職業管理</h3>
            <div id="job-modal-hero-stats" style="background:#161720; padding:10px; border-radius:6px; margin-bottom:12px; font-size:12px; border:1px solid var(--panel-border);"></div>
            <div class="job-modal-layout">
                <div class="job-left-panel" id="job-left-desc">
                    <p style="color:#aaa;">請點擊右側職業列表查看描述與技能。</p>
                </div>
                <div class="job-right-panel" id="job-right-list"></div>
            </div>
        </div>
    </div>

    <!-- 必須先載入 database.js 模組 -->
    <script src="database.js"></script>
    <script src="game.js"></script>
</body>
</html>
