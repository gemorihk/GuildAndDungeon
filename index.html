<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公會與地下城 - 戰術九宮格版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <div>
            <span style="font-weight:bold; color:var(--accent);">⚔️ 公會與地下城 (戰術版)</span>
        </div>
        <div class="res-container">
            <span>🪙 金幣: <span id="res-gold">500</span></span>
            <button class="btn btn-success" onclick="manualSaveGame()">💾 存檔</button>
            <button class="btn btn-danger" onclick="resetSaveData()">🔄 重置</button>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn active" onclick="switchTab('battle', this)">⚔️ 戰術九宮格戰場</button>
        <button class="nav-btn" onclick="switchTab('heroes', this)">👥 冒險者陣型</button>
        <button class="nav-btn" onclick="switchTab('inventory', this)">🎒 背包倉庫</button>
    </div>

    <div class="main-content">
        <!-- 戰鬥頁籤：3x3 九宮格 -->
        <div id="tab-battle" class="tab-content active">
            <div style="margin-bottom: 10px; display: flex; gap: 10px; align-items: center;">
                <select id="dungeon-select" onchange="changeDungeon(this.value)"></select>
                <button class="btn btn-success" id="explore-btn" onclick="toggleExplore()">🚀 開始戰術探索</button>
                <button class="btn btn-danger" onclick="retreatAndSettle()">🏠 撤退結算</button>
            </div>

            <div class="tactical-battle-container">
                <!-- 我方 3x3 網格 -->
                <div class="grid-side-panel">
                    <h4 style="margin:0 0 5px 0; color:var(--accent);">🛡️ 我方戰術陣地 (3x3)</h4>
                    <div class="grid-3x3" id="player-grid-3x3"></div>
                </div>
                <!-- 敵方 3x3 網格 -->
                <div class="grid-side-panel">
                    <h4 style="margin:0 0 5px 0; color:var(--danger);">⚔️ 敵方戰術陣地 (3x3)</h4>
                    <div class="grid-3x3" id="enemy-grid-3x3"></div>
                </div>
            </div>

            <div class="battle-log" id="battle-log">
                <div>[系統] 進入 3x3 戰術九宮格戰場。</div>
            </div>
        </div>

        <!-- 冒險者頁籤 -->
        <div id="tab-heroes" class="tab-content">
            <button class="btn btn-success" onclick="recruitHero()" style="margin-bottom:10px;">🍺 招募冒險者 (120金幣)</button>
            <div id="hero-list"></div>
        </div>

        <!-- 背包頁籤 -->
        <div id="tab-inventory" class="tab-content">
            <h3>🎒 背包與裝備</h3>
            <div id="inventory-grid"></div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="game.js"></script>
</body>
</html>
